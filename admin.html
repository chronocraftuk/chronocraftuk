<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChronoCraftUK | Restoration Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #090909;
            color: #f5f5f5;
            font-family: "Montserrat", sans-serif;
        }

        .topbar {
            background: #111;
            border-bottom: 1px solid #9a6a3a;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            font-family: "Playfair Display", serif;
            color: #c8945d;
            font-size: 26px;
            letter-spacing: 2px;
        }

        .admin-label {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            width: min(1200px, 92%);
            margin: 40px auto;
        }

        .login-card {
            max-width: 480px;
            margin: 80px auto;
            background: #151515;
            border: 1px solid #3a2a1d;
            padding: 35px;
            border-radius: 8px;
        }

        h1, h2, h3 {
            font-family: "Playfair Display", serif;
        }

        .login-card h1 {
            color: #c8945d;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #aaa;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #0d0d0d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #c8945d;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .primary-button {
            width: 100%;
            padding: 14px;
            background: #c8945d;
            color: #111;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        .primary-button:hover {
            background: #deb17e;
        }

        .error-message {
            color: #ff8080;
            margin-top: 15px;
            line-height: 1.5;
        }

        .dashboard {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .dashboard-header h1 {
            font-size: 38px;
            color: #f4f4f4;
        }

        .dashboard-header p {
            color: #999;
            margin-top: 8px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .small-button {
            padding: 11px 16px;
            border: 1px solid #c8945d;
            background: transparent;
            color: #c8945d;
            border-radius: 4px;
            font-weight: 600;
        }

        .small-button:hover {
            background: #c8945d;
            color: #111;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #151515;
            border: 1px solid #292929;
            padding: 20px;
            border-radius: 6px;
        }

        .stat-card span {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card strong {
            display: block;
            font-size: 30px;
            margin-top: 8px;
            color: #c8945d;
        }

        .enquiries {
            display: grid;
            gap: 20px;
        }

        .enquiry-card {
            background: #151515;
            border: 1px solid #292929;
            border-left: 4px solid #c8945d;
            border-radius: 6px;
            overflow: hidden;
        }

        .enquiry-head {
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #292929;
        }

        .enquiry-head h2 {
            font-size: 23px;
        }

        .date {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        .status-select {
            width: auto;
            min-width: 170px;
            margin: 0;
        }

        .enquiry-body {
            padding: 22px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        .detail {
            background: #0e0e0e;
            padding: 15px;
            border-radius: 4px;
        }

        .detail-label {
            color: #8f8f8f;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .detail-value {
            line-height: 1.5;
            word-break: break-word;
        }

        .message-box {
            background: #0e0e0e;
            padding: 18px;
            margin-bottom: 22px;
            border-radius: 4px;
        }

        .message-box p {
            line-height: 1.7;
            color: #ddd;
            white-space: pre-wrap;
        }

        .media-title {
            margin-bottom: 12px;
            color: #c8945d;
        }

        .media-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .media-button {
            display: inline-block;
            padding: 10px 15px;
            background: #292929;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
        }

        .media-button:hover {
            border-color: #c8945d;
            color: #c8945d;
        }

        .no-media,
        .empty-state {
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #151515;
            border: 1px solid #292929;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #c8945d;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header h1 {
                font-size: 30px;
            }

            .topbar {
                padding: 17px 20px;
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .header-buttons {
                width: 100%;
            }

            .small-button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div>
        <div class="brand">CHRONOCRAFTUK</div>
        <div class="admin-label">Private Management Dashboard</div>
    </div>
</header>

<main class="container">

    <section id="loginSection" class="login-card">
        <h1>Admin Login</h1>
        <p>Sign in to manage ChronoCraftUK restoration enquiries.</p>

        <form id="loginForm">
            <label for="adminEmail">Email</label>
            <input
                type="email"
                id="adminEmail"
                autocomplete="email"
                required
            >

            <label for="adminPassword">Password</label>
            <input
                type="password"
                id="adminPassword"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="primary-button">
                Sign In
            </button>

            <div id="loginError" class="error-message"></div>
        </form>
    </section>

    <section id="dashboard" class="dashboard">

        <div class="dashboard-header">
            <div>
                <h1>Restoration Enquiries</h1>
                <p>Manage customer quote requests and restoration work.</p>
            </div>

            <div class="header-buttons">
                <button id="refreshButton" class="small-button">
                    Refresh
                </button>

                <button id="logoutButton" class="small-button">
                    Log Out
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span>Total Enquiries</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat-card">
                <span>New</span>
                <strong id="newCount">0</strong>
            </div>

            <div class="stat-card">
                <span>In Progress</span>
                <strong id="progressCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedCount">0</strong>
            </div>
        </div>

        <div id="loading" class="loading">
            Loading enquiries...
        </div>

        <div id="enquiries" class="enquiries"></div>

    </section>

</main>

<script>
const SUPABASE_URL = 'https://qfadjaplhhdabzgrpvbg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kQQnUS5qd6zkFivIvNpkLg_UpUwkZOK';

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loginSection = document.getElementById('loginSection');
const dashboard = document.getElementById('dashboard');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const enquiriesContainer = document.getElementById('enquiries');
const loading = document.getElementById('loading');

const statuses = [
    'new',
    'contacted',
    'quote sent',
    'accepted',
    'in progress',
    'completed',
    'declined'
];

async function checkLogin() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
        showDashboard();
    } else {
        showLogin();
    }
}

function showLogin() {
    loginSection.style.display = 'block';
    dashboard.style.display = 'none';
}

async function showDashboard() {
    loginSection.style.display = 'none';
    dashboard.style.display = 'block';
    await loadEnquiries();
}

loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    loginError.textContent = '';

    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        loginError.textContent = 'Login failed: ' + error.message;
        return;
    }

    loginForm.reset();
    await showDashboard();
});

document.getElementById('logoutButton').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    showLogin();
});

document.getElementById('refreshButton').addEventListener('click', async () => {
    await loadEnquiries();
});

async function loadEnquiries() {
    loading.style.display = 'block';
    enquiriesContainer.innerHTML = '';

    const { data, error } = await supabaseClient
        .from('Restoration_Requests')
        .select('*')
        .order('created_at', { ascending: false });

    loading.style.display = 'none';

    if (error) {
        enquiriesContainer.innerHTML =
            '<div class="empty-state">Unable to load enquiries: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }

    updateStats(data);

    if (!data || data.length === 0) {
        enquiriesContainer.innerHTML =
            '<div class="empty-state">No restoration enquiries yet.</div>';

        return;
    }

    for (const enquiry of data) {
        const card = await createEnquiryCard(enquiry);
        enquiriesContainer.appendChild(card);
    }
}

function updateStats(data) {
    document.getElementById('totalCount').textContent = data.length;

    document.getElementById('newCount').textContent =
        data.filter(item => (item.status || 'new').toLowerCase() === 'new').length;

    document.getElementById('progressCount').textContent =
        data.filter(item => (item.status || '').toLowerCase() === 'in progress').length;

    document.getElementById('completedCount').textContent =
        data.filter(item => (item.status || '').toLowerCase() === 'completed').length;
}

async function createEnquiryCard(enquiry) {
    const card = document.createElement('article');
    card.className = 'enquiry-card';

    const date = enquiry.created_at
        ? new Date(enquiry.created_at).toLocaleString('en-GB')
        : 'Unknown date';

    const currentStatus = (enquiry.status || 'new').toLowerCase();

    let statusOptions = '';

    for (const status of statuses) {
        const selected = status === currentStatus ? 'selected' : '';

        statusOptions += `
            <option value="${escapeHtml(status)}" ${selected}>
                ${formatStatus(status)}
            </option>
        `;
    }

    const photoButtons = await buildPhotoLinks(enquiry.photo_urls);
    const videoButton = await buildVideoLink(enquiry.video_url);

    card.innerHTML = `
        <div class="enquiry-head">
            <div>
                <h2>${escapeHtml(enquiry.customer_name || 'Unnamed Customer')}</h2>
                <div class="date">${escapeHtml(date)}</div>
            </div>

            <select
                class="status-select"
                data-id="${enquiry.id}"
            >
                ${statusOptions}
            </select>
        </div>

        <div class="enquiry-body">

            <div class="details-grid">

                <div class="detail">
                    <div class="detail-label">Email</div>
                    <div class="detail-value">
                        ${escapeHtml(enquiry.email || 'Not provided')}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Phone</div>
                    <div class="detail-value">
                        ${escapeHtml(enquiry.phone || 'Not provided')}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Watch / Model</div>
                    <div class="detail-value">
                        ${escapeHtml(enquiry.watch_model || 'Not provided')}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Request ID</div>
                    <div class="detail-value">
                        #${escapeHtml(String(enquiry.id))}
                    </div>
                </div>

            </div>

            <div class="message-box">
                <div class="detail-label">Customer Request</div>
                <p>${escapeHtml(enquiry.message || 'No message provided')}</p>
            </div>

            <h3 class="media-title">Customer Uploads</h3>

            <div class="media-links">
                ${photoButtons}
                ${videoButton}
            </div>

        </div>
    `;

    const statusSelect = card.querySelector('.status-select');

    statusSelect.addEventListener('change', async () => {
        const newStatus = statusSelect.value;

        const { error } = await supabaseClient
            .from('Restoration_Requests')
            .update({
                status: newStatus
            })
            .eq('id', enquiry.id);

        if (error) {
            alert('Unable to update status: ' + error.message);
            statusSelect.value = currentStatus;
            return;
        }

        await loadEnquiries();
    });

    return card;
}

async function buildPhotoLinks(photoUrls) {
    if (!photoUrls) {
        return '<span class="no-media">No photos uploaded</span>';
    }

    let paths = [];

    try {
        paths = JSON.parse(photoUrls);
    } catch {
        paths = [photoUrls];
    }

    if (!Array.isArray(paths) || paths.length === 0) {
        return '<span class="no-media">No photos uploaded</span>';
    }

    let output = '';

    for (let i = 0; i < paths.length; i++) {
        const path = paths[i];

        if (!path) continue;

        const { data, error } = await supabaseClient.storage
            .from('restoration-requests')
            .createSignedUrl(path, 3600);

        if (!error && data?.signedUrl) {
            output += `
                <a
                    class="media-button"
                    href="${data.signedUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View Photo ${i + 1}
                </a>
            `;
        }
    }

    return output || '<span class="no-media">No photos available</span>';
}

async function buildVideoLink(videoPath) {
    if (!videoPath) {
        return '';
    }

    const { data, error } = await supabaseClient.storage
        .from('restoration-requests')
        .createSignedUrl(videoPath, 3600);

    if (error || !data?.signedUrl) {
        return '';
    }

    return `
        <a
            class="media-button"
            href="${data.signedUrl}"
            target="_blank"
            rel="noopener noreferrer"
        >
            View Video
        </a>
    `;
}

function formatStatus(status) {
    return status
        .split(' ')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
}

function escapeHtml(value) {
    return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (!session) {
        showLogin();
    }
});

checkLogin();
</script>

</body>
</html>
